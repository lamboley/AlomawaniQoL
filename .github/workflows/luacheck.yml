name: Luacheck

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  luacheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      - name: Run Luacheck
        run: luacheck .
